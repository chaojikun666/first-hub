<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>炒鸡坤的名片</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img class="avatar" src="images/avatar.png" alt="临时头像">
        <h1>炒鸡坤</h1>
        <p class="role">前端初学者 · 正在做人生第一个网页</p>
        <p class="skills">HTML · CSS · GIT · GITHUB</p>
        <div class="contact">
            <a href="about.html">关于我</a>
            <a href="mailto:你的真实邮箱@qq.com">邮箱</a>
            <a href="https://github.com/chaojikun666" target="_blank">GitHub</a>
        </div>
            <button class="theme-toggle" id="theme-toggle">切换深色</button>
    </div>
       <script>
        // ① 找到那个按钮，起个名字记住它
        const btn = document.querySelector('#theme-toggle');

        // ② 告诉它：被点了就执行后面这段
        btn.addEventListener('click', function () {
            // ③ 给 <html> 加上/去掉 dark 这个 class
            document.documentElement.classList.toggle('dark');
        });
    </script> 
</body>
</html>
