<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>炒鸡坤的名片</title>
    <style>
        body {
            background-color: lightgreen;
            text-align: center;
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .card {
            max-width: 480px;
            margin: 80px auto;
            padding: 40px 24px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin: 0 0 8px;
        }

        .role {
            font-size: 15px;
            color: #666666;
            margin: 0 0 24px;
        }

        .skills {
            font-size: 13px;
            color: #999999;
            letter-spacing: 2px;
            margin: 0;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }

        .contact {
            margin-top: 28px;
        }

        .contact a {
            display: inline-block;
            margin: 0 4px;
            padding: 10px 18px;
            font-size: 13px;
            color: #444444;
            text-decoration: none;
            border: 1px solid #dddddd;
            border-radius: 999px;
            transition: all 0.2s;
        }

        .contact a:hover {
            color: #ffffff;
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>炒鸡坤</h1>
        <p class="role">前端初学者 · 正在做人生第一个网页</p>
        <p class="skills">HTML · CSS · GIT · GITHUB</p>
        <div class="contact">
            <a href="mailto:你的邮箱@example.com">邮箱</a>
            <a href="https://github.com/chaojikun666" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
