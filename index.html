<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>炒鸡坤的名片</title>
    <style>
        body {
            background-color: lightgreen;
            text-align: center;
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .card {
            max-width: 480px;
            margin: 80px auto;
            padding: 40px 24px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin: 0 0 8px;
        }

        .role {
            font-size: 15px;
            color: #666666;
            margin: 0 0 24px;
        }

        .skills {
            font-size: 13px;
            color: #999999;
            letter-spacing: 2px;
            margin: 0;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>炒鸡坤</h1>
        <p class="role">前端初学者 · 正在做人生第一个网页</p>
        <p class="skills">HTML · CSS · GIT · GITHUB</p>
    </div>

</html>
